<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#46178f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quizfall">
<meta name="description" content="Quizfall: a fast, colourful live quiz. Pick the right colour before the clock runs out.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Quizfall</title>
<style>
:root{
  --bg:#46178f;--bg2:#381272;--ink:#141a33;--card:#fff;--muted:rgba(255,255,255,.72);
  --c0:#e21b3c;--c1:#1368ce;--c2:#d89e00;--c3:#26890c;--brand:#46178f;--purple:#864cbf;
  --good:#66bf39;--bad:#f35;
  --r:clamp(10px,1.4vmin,18px);
  --font:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid #fff;outline-offset:3px}
#bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(160deg,#4b1a96 0%,#46178f 45%,#3a1078 100%)}
#bgfx i{position:absolute;opacity:.07;background:#000;animation:drift 30s linear infinite}
#bgfx i:nth-child(1){width:42vmax;height:42vmax;left:-14vmax;bottom:-16vmax;border-radius:50%}
#bgfx i:nth-child(2){width:30vmax;height:30vmax;right:-9vmax;top:-9vmax;transform:rotate(45deg);background:#fff;opacity:.05;animation-duration:36s}
#bgfx i:nth-child(3){width:18vmax;height:18vmax;right:10vmax;bottom:6vmax;border-radius:50%;background:#fff;opacity:.04;animation-duration:41s}
#bgfx i:nth-child(4){width:16vmax;height:16vmax;left:22vmax;top:-6vmax;transform:rotate(20deg);animation-duration:27s}
@keyframes drift{0%{translate:0 0;rotate:0deg}50%{translate:2vmax 3vmax;rotate:25deg}100%{translate:0 0;rotate:0deg}}
#app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:calc(var(--sat) + 8px) max(10px,env(safe-area-inset-right)) calc(var(--sab) + 10px) max(10px,env(safe-area-inset-left))}
#top{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 4px 8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:clamp(20px,2.6vmin,30px);letter-spacing:-.02em}
.logo .mk{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:1.15em;height:1.15em;transform:rotate(-8deg)}
.logo .mk b{border-radius:3px}.logo .mk b:nth-child(1){background:var(--c0)}.logo .mk b:nth-child(2){background:var(--c1)}.logo .mk b:nth-child(3){background:var(--c2)}.logo .mk b:nth-child(4){background:var(--c3)}
#top .mid{flex:1;display:flex;justify-content:center;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 14px;font-weight:800;font-size:clamp(13px,1.7vmin,20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{background:rgba(255,255,255,.2)}
#stage{position:relative;min-height:0;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(8px,1.6vmin,18px);animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.center{align-items:center;justify-content:center;text-align:center}
h1,h2,h3,p{margin:0}
.big{font-size:clamp(30px,6vmin,76px);font-weight:900;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.mid-t{font-size:clamp(24px,4.6vmin,52px)}
.sub{font-size:clamp(16px,2.4vmin,28px);font-weight:700;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:12px 28px;border-radius:14px;background:#fff;color:var(--ink);font-weight:900;font-size:clamp(17px,2.3vmin,28px);box-shadow:0 5px 0 rgba(0,0,0,.28);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:none;border:1.5px solid rgba(255,255,255,.3)}
.btn.go{background:var(--c3);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}

/* shapes and tiles */
.shp{width:1em;height:1em;flex:none;fill:#fff;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
.t0{background:var(--c0)}.t1{background:var(--c1)}.t2{background:var(--c2)}.t3{background:var(--c3)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,1.2vmin,14px);flex:none}
.tile{position:relative;display:flex;align-items:center;gap:clamp(10px,1.6vmin,20px);min-height:clamp(64px,13vh,150px);padding:clamp(10px,1.6vmin,22px) clamp(12px,2vmin,26px);border-radius:var(--r);
  font-weight:900;font-size:clamp(17px,3.1vmin,40px);line-height:1.12;text-align:left;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.22);box-shadow:0 5px 0 rgba(0,0,0,.25);transition:opacity .3s,transform .15s,filter .3s;overflow:hidden;word-break:break-word}
.tile .shp{font-size:clamp(26px,4.6vmin,56px)}
.tile .tx{flex:1;min-width:0}
.tile.long{font-size:clamp(14px,2.3vmin,30px)}
button.tile:hover{filter:brightness(1.07)}
button.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.tile.dim{opacity:.28;filter:saturate(.6)}
.tile.win{transform:scale(1.02);box-shadow:0 0 0 4px #fff,0 6px 0 rgba(0,0,0,.25)}
.tile .ok{margin-left:auto;width:clamp(30px,4.4vmin,52px);height:clamp(30px,4.4vmin,52px);border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.tile .ok svg{width:62%;height:62%;fill:none;stroke:var(--good);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.tile .mine{position:absolute;right:10px;top:8px;font-size:12px;font-weight:900;background:rgba(0,0,0,.28);padding:3px 8px;border-radius:999px}
.tile code,.qcard code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-weight:800}

/* question card */
.qcard{background:var(--card);color:var(--ink);border-radius:var(--r);padding:clamp(12px,2.2vmin,30px) clamp(14px,2.6vmin,36px);text-align:center;font-weight:900;font-size:clamp(21px,4.4vmin,60px);line-height:1.12;box-shadow:0 6px 0 rgba(0,0,0,.25);flex:none;word-break:break-word}
.qcard.long{font-size:clamp(18px,3.3vmin,44px)}
.qcard .tag{display:block;font-size:.38em;font-weight:800;color:#5a6390;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.35em}
.qmid{flex:1;min-height:0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:clamp(8px,2vmin,24px)}
.qmid .media{min-height:0;height:100%;display:flex;align-items:center;justify-content:center}
.qmid .media img{max-height:100%;max-width:100%;min-height:60px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.35);background:#fff;object-fit:contain}
.ring{position:relative;width:clamp(70px,13vmin,150px);height:clamp(70px,13vmin,150px);flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring::before{content:'';position:absolute;inset:4%;border-radius:50%;background:var(--purple);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.ring svg{position:relative}
.ring .bgc{stroke:rgba(255,255,255,.12)}
.ring .fgc{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
.ring.hurry .fgc{stroke:#ffcc3d}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(28px,5.6vmin,64px);font-weight:900}
.ring.hurry b{animation:beat 1s ease infinite}
@keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.14)}}
.counter{text-align:center;font-weight:900;min-width:clamp(70px,13vmin,150px)}
.counter b{display:block;background:rgba(0,0,0,.18);border-radius:999px;padding:.12em .5em;font-size:clamp(28px,5.6vmin,64px);line-height:1}
.counter span{font-size:clamp(13px,1.8vmin,22px);color:var(--muted)}
.foot{display:flex;justify-content:flex-end;gap:10px;flex:none}

/* bar chart */
.chart{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2vmin,26px);height:100%;min-height:90px;padding-top:8px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;width:clamp(46px,9vmin,120px);height:100%}
.bar .n{font-weight:900;font-size:clamp(18px,3vmin,36px);display:flex;align-items:center;gap:6px}
.bar .n svg{width:.9em;height:.9em;fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.bar .col{width:100%;border-radius:8px 8px 0 0;min-height:6px;height:0;transition:height .7s cubic-bezier(.2,.9,.3,1.2)}
.bar .base{width:100%;display:grid;place-items:center;padding:6px 0;border-radius:0 0 8px 8px;font-size:clamp(18px,3vmin,34px)}
.bar.dim{opacity:.35}

/* intro */
.intro .num{font-size:clamp(16px,2.6vmin,30px);font-weight:900;background:#fff;color:var(--ink);padding:8px 20px;border-radius:999px}
.intro .q{font-size:clamp(26px,6vmin,78px);font-weight:900;line-height:1.1;max-width:22ch;text-wrap:balance}
.intro img{max-height:28vh;max-width:70vw;border-radius:12px;background:#fff}
.load{width:min(520px,70vw);height:12px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden}
.load i{display:block;height:100%;width:0;background:#fff;border-radius:999px;animation:fill linear forwards}
@keyframes fill{to{width:100%}}

/* lobby */
.lobby{align-items:center;text-align:center}
.lobby .head{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:2vh}
.plist{flex:1;min-height:0;width:100%;overflow:auto;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:clamp(8px,1.4vmin,16px);padding:10px}
.chip{display:inline-flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border-radius:999px;padding:6px 18px 6px 6px;font-weight:900;font-size:clamp(16px,2.4vmin,28px);box-shadow:0 4px 0 rgba(0,0,0,.25);animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
.chip.off{opacity:.45}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.av{--h:200;width:clamp(36px,5.2vmin,60px);height:clamp(36px,5.2vmin,60px);border-radius:50%;background:hsl(var(--h) 70% 55%);color:#fff;display:grid;place-items:center;font-weight:900;font-size:.8em;overflow:hidden;flex:none}
.av.img{background:#fff}
.av img{width:100%;height:100%;object-fit:cover}
.count{display:flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(18px,2.8vmin,32px)}
.count b{font-size:1.6em}

/* scoreboard */
.board{align-items:center}
.sb{position:relative;width:min(1000px,100%);flex:none;--rh:clamp(50px,8.4vh,92px);--gap:clamp(8px,1.4vh,14px);height:calc(5*(var(--rh) + var(--gap)))}
.srow{position:absolute;left:0;right:0;top:0;height:var(--rh);display:flex;align-items:center;gap:clamp(8px,1.6vmin,18px);padding:0 clamp(12px,2vmin,24px);background:#fff;color:#333;border-radius:6px;
  font-weight:900;font-size:clamp(18px,3.2vmin,38px);box-shadow:0 4px 0 rgba(0,0,0,.25);transform:translateY(calc(var(--i)*(var(--rh) + var(--gap))));transition:transform .9s cubic-bezier(.25,.9,.25,1.12),opacity .5s,background .4s,color .4s}
.srow.out{opacity:0}
.srow .av{width:calc(var(--rh)*.66);height:calc(var(--rh)*.66)}
.srow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .pt{font-variant-numeric:tabular-nums;min-width:4ch;text-align:right}
.srow .fl{display:inline-flex;align-items:center;gap:2px;background:#333;color:#fff;border-radius:999px;padding:3px 10px 3px 6px;font-size:.62em;transform:scale(0);transition:transform .45s cubic-bezier(.2,1.8,.4,1)}
.srow .fl svg{width:1.15em;height:1.15em;fill:#ff8a00}
.srow .fl.on{transform:scale(1)}
.srow .plus{font-size:.62em;color:var(--c3);opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s}
.srow .plus.on{opacity:1;transform:none}
.srow .mv{width:2.6em;text-align:center;font-size:.6em;opacity:0;transition:opacity .4s}
.srow .mv.on{opacity:1}
.srow.climb{animation:climb 1.1s ease .2s both}
.srow.lead{background:#fff;box-shadow:0 0 0 4px #ffd23f,0 4px 0 rgba(0,0,0,.25)}
@keyframes climb{0%,100%{filter:none}40%{filter:drop-shadow(0 0 14px #ffd23f) brightness(1.04)}}
.sbanner{display:flex;align-items:center;gap:10px;background:#333;color:#fff;border-radius:999px;padding:8px 20px;font-weight:900;font-size:clamp(15px,2.4vmin,26px);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:1.2s}
.sbanner svg{width:1.3em;height:1.3em;fill:#ff8a00}
.board h2{font-size:clamp(26px,5vmin,60px);font-weight:900;background:#fff;color:#333;padding:8px 28px;border-radius:6px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.rows{width:min(900px,100%);display:flex;flex-direction:column;gap:clamp(6px,1.2vmin,12px);flex:1;min-height:0;overflow:auto;padding:4px}
.prow{display:flex;align-items:center;gap:clamp(8px,1.6vmin,18px);background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.18);border-radius:14px;padding:clamp(6px,1.2vmin,12px) clamp(10px,1.8vmin,20px);font-weight:900;font-size:clamp(17px,2.8vmin,34px);animation:slide .45s ease both}
.prow.me{background:#fff;color:var(--ink)}
.prow .rk{width:1.6em;text-align:center}
.prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pt{font-variant-numeric:tabular-nums}
.mv{width:3.2em;text-align:right;font-size:.75em}
.mv.up{color:#4be08a}.mv.dn{color:#ff8a8a}.prow.me .mv.up{color:var(--good)}.prow.me .mv.dn{color:var(--bad)}
@keyframes slide{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}

/* podium */
.end{overflow:auto;align-items:center}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2vmin,24px);width:min(900px,100%);height:min(62vh,560px);flex:none}
.pcol{flex:1;max-width:240px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.pcol .who{display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;animation:in .5s ease both;animation-delay:var(--d)}
.pcol .who .av{width:clamp(60px,11vmin,130px);height:clamp(60px,11vmin,130px);border:4px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.pcol .who .nm{font-weight:900;font-size:clamp(16px,2.8vmin,32px);max-width:100%;text-align:center;word-break:break-word}
.pcol .who .pt{font-weight:800;color:var(--muted);font-size:clamp(14px,2vmin,24px)}
.step{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:start center;padding-top:10px;font-weight:900;font-size:clamp(34px,7vmin,90px);color:rgba(255,255,255,.95);text-shadow:0 3px 0 rgba(0,0,0,.25);transform-origin:bottom;animation:rise .8s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:var(--d);margin-top:10px}
@keyframes rise{from{transform:scaleY(0)}to{transform:none}}
.p1 .step{height:62%;background:linear-gradient(#ffd23f,#e0a200)}
.p2 .step{height:44%;background:linear-gradient(#cfd6e6,#93a0bf)}
.p3 .step{height:30%;background:linear-gradient(#f0a46b,#c4733a)}
.fullrank{width:min(900px,100%);display:flex;flex-direction:column;gap:8px;padding:10px 4px 20px}
.fullrank h3{font-size:clamp(20px,3vmin,34px);font-weight:900;text-align:center;margin:6px 0}

/* player phone */
.pl-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900;font-size:clamp(15px,2.2vmin,22px)}
.pl-q{background:#fff;color:var(--ink);border-radius:14px;padding:10px 14px;font-weight:900;font-size:clamp(16px,2.6vmin,28px);text-align:center;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:8px;max-height:30vh;overflow:hidden}
.pl-q img{max-height:16vh;max-width:60%;border-radius:8px}
.pl-tiles{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px}
.pl-tiles .tile{flex-direction:column;justify-content:center;text-align:center;min-height:0;font-size:clamp(17px,3vmin,30px)}
.pl-tiles .tile .shp{font-size:clamp(34px,8vmin,80px)}
.pl-tiles .tile.long{font-size:clamp(14px,2.3vmin,24px)}
.timerpill{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;min-width:3.4em;justify-content:center;font-variant-numeric:tabular-nums}
.timerpill.hurry{background:#ffcc3d}
.full{position:absolute;inset:-8px -10px -10px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(10px,2.4vmin,22px);padding:20px}
.full.good{background:var(--good)}.full.bad{background:var(--bad)}.full.neutral{background:#3b4a8f}
.full .mark{width:clamp(80px,20vmin,150px);height:clamp(80px,20vmin,150px);border-radius:50%;background:#fff;display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.full .mark svg{width:60%;height:60%;fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.full.good .mark svg{stroke:var(--good)}.full.bad .mark svg,.full.neutral .mark svg{stroke:var(--bad)}
.full .pts{font-size:clamp(28px,7vmin,64px);font-weight:900;background:rgba(0,0,0,.28);padding:6px 26px;border-radius:6px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) .35s both}
.full .streak{animation:pop .5s cubic-bezier(.2,1.6,.4,1) .6s both}
.full .place{animation:in .4s ease .9s both}
.full.good{background:radial-gradient(circle at 50% 35%,#7ad14c,#66bf39 60%,#58a92f)}
.full.bad{background:radial-gradient(circle at 50% 35%,#ff5c74,#f35 60%,#d92243)}
#pbar{display:flex;align-items:center;gap:10px;background:#fff;color:#333;border-radius:4px;margin:8px -10px calc(-1*(var(--sab) + 10px));padding:10px 14px calc(var(--sab) + 10px);font-weight:900;font-size:clamp(16px,2.4vmin,22px);position:relative;z-index:2}
#pbar .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pbar .sc{background:#333;color:#fff;border-radius:4px;padding:4px 14px;font-variant-numeric:tabular-nums}
#pbar .av{width:34px;height:34px}
.funny{font-size:clamp(20px,4vmin,30px);font-weight:900;max-width:18ch}
.streak{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:clamp(16px,2.6vmin,26px);background:rgba(255,255,255,.2);padding:6px 16px;border-radius:999px}
.streak svg{width:1.1em;height:1.1em;fill:#ff8a00}
.streak{background:#333!important}
.place{font-weight:800;font-size:clamp(17px,2.8vmin,28px);max-width:26ch}
.spin{width:54px;height:54px;border-radius:50%;border:6px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lockbig{display:grid;place-items:center;width:clamp(90px,24vmin,160px);height:clamp(90px,24vmin,160px);border-radius:24px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.lockbig .shp{font-size:clamp(50px,13vmin,90px)}

/* solo banner */
.banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 30px;border-radius:18px;font-weight:900;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:pop .4s cubic-bezier(.2,1.6,.4,1) both;pointer-events:none}
.banner.good{background:var(--good)}.banner.bad{background:var(--bad)}
.banner b{font-size:clamp(28px,6vmin,64px)}
.banner span{font-size:clamp(16px,2.6vmin,26px)}

/* menu (solo) */
.menu{overflow:auto;align-items:center;padding-bottom:10px}
.menu .card{width:min(760px,100%);background:#fff;color:var(--ink);border-radius:20px;padding:clamp(14px,2.4vmin,26px);display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.menu h3{font-size:14px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#5a6390}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border-radius:999px;padding:10px 16px;font-weight:800;font-size:15px;background:#eef1fa;color:var(--ink);border:1.5px solid #dfe4f3}
.chips button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.topics button{text-align:left;border-radius:12px;padding:10px 14px;background:#f4f6fc;border:1.5px solid #e2e6f3;display:flex;flex-direction:column;gap:2px}
.topics button strong{font-size:16px}
.topics button span{font-size:13px;color:#5a6390;font-weight:600}
.topics button[aria-pressed=true]{border-color:var(--brand);background:#e9edff;box-shadow:inset 0 0 0 1.5px var(--brand)}
.menu .card{--eq-on-bg:var(--brand);--eq-on-fg:#fff}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:2vh 0 6px;text-align:center}
.hero .logo{font-size:clamp(40px,9vmin,84px)}
.hero p{color:var(--muted);font-weight:700;font-size:clamp(15px,2.2vmin,22px)}
.best{font-size:14px;font-weight:800;color:#5a6390;text-align:center}
.stats{display:flex;gap:clamp(10px,2vmin,24px);justify-content:center;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.12);border-radius:16px;padding:12px 22px;text-align:center;min-width:120px}
.stat b{display:block;font-size:clamp(26px,5vmin,52px);font-weight:900}
.stat span{font-weight:800;color:var(--muted);font-size:clamp(13px,1.8vmin,18px)}
.missed{width:min(760px,100%);background:#fff;color:var(--ink);border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.missed li{display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:700;border-top:1px solid #eef0f6;padding-top:8px}
.missed li:first-child{border-top:0;padding-top:0}
.missed ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.missed img{height:26px;vertical-align:middle;margin-right:6px;border-radius:3px}
.missed s{color:var(--bad);margin-right:8px}.missed b{color:var(--good)}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(5,8,25,.72);display:grid;place-items:center;padding:20px;animation:in .25s ease both}
.overlay .card{background:#fff;color:var(--ink);border-radius:20px;padding:24px;width:min(480px,100%);display:flex;flex-direction:column;gap:14px;text-align:center}
.overlay .card h2{font-size:28px;font-weight:900}
.overlay .card ul{text-align:left;margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-weight:700}
.overlay .card li{display:flex;gap:10px;align-items:flex-start}
.overlay .card li i{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.overlay .card .btn{background:var(--brand);color:#fff}
.note{font-weight:800;color:var(--muted);text-align:center}
#fx{position:fixed;inset:0;z-index:30;pointer-events:none;width:100%;height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* landscape phones: tighter */
@media (max-height:500px){
  .tile{min-height:52px;font-size:clamp(15px,3.4vh,24px)}
  .qcard{font-size:clamp(18px,5.4vh,34px);padding:8px 14px}
  .ring,.counter{width:auto;min-width:0}.ring{width:64px;height:64px}.ring b,.counter b{font-size:26px}
  .podium{height:70vh}
}
@media (orientation:portrait) and (max-width:900px){
  .tile{min-height:clamp(84px,17vh,220px)}
  .qmid .media img{max-height:min(100%,30vh)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  #bgfx i{animation:none}
}
</style>
</head>
<body>
<div id="bgfx" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div id="app">
  <header id="top">
    <div class="logo" data-noi18n><span class="mk" aria-hidden="true"><b></b><b></b><b></b><b></b></span>Quizfall</div>
    <div class="mid" id="topMid"></div>
    <button class="icon-btn" id="muteBtn" type="button" aria-label="Sound off"></button>
    <button class="icon-btn" id="quitBtn" type="button" aria-label="Pause" hidden><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
  </header>
  <main id="stage" aria-live="polite"></main>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<script src="questions.js"></script>
<script src="game.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})</script>
</body>
</html>
